name: ci

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; nothing here writes to it.
permissions:
  contents: read

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run ci
      - run: pnpm exec playwright test --project=chromium
      # Frame timing on a shared runner is evidence, not a gate: a stall shows up as an annotation on the run and
      # in the report, and the merge is not held on it. Locally `pnpm test:e2e` still runs it as a failing test.
      - name: Frame budgets (advisory)
        run: pnpm exec playwright test --project=frame-budget --no-deps --reporter=github,list
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
