name: lighthouse

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; nothing here writes to it.
permissions:
  contents: read

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Serves the production build (next start) and audits "/" and an Analyst URL, 3 runs each.
      # Every assertion is an error: accessibility, performance, LCP, CLS, TBT and script weight (see docs/performance-monitoring.md).
      - run: pnpm exec lhci autorun
        env:
          LHCI_UPLOAD__TARGET: temporary-public-storage
      - name: Link the reports in the job summary
        if: always()
        run: |
          {
            echo "### Lighthouse reports"
            echo
            if [ -f .lighthouseci/links.json ]; then
              node -e 'const l=require("./.lighthouseci/links.json");for(const [u,r] of Object.entries(l))console.log("- ["+u+"]("+r+")")'
            else
              echo "No report links were produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
